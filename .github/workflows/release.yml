name: Publication Foundry

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Valider et tester
        run: npm run check

      - name: Vérifier le tag et préparer le module
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag invalide : $GITHUB_REF_NAME"
            exit 1
          fi
          node tools/prepare-release.mjs "$VERSION"

      - name: Construire le ZIP Foundry
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="six-crowns-kingmaker-card-game-v${VERSION}.zip"

          cd dist/module
          zip -r "../../${ARCHIVE}" .
          cd ../..

          mkdir -p release-assets
          cp dist/module/module.json release-assets/module.json
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          NOTES_FILE="documentation/releases/${GITHUB_REF_NAME}.md"

          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              "$ARCHIVE" \
              "release-assets/module.json" \
              --title "Le Jeu des Six Couronnes ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              "$ARCHIVE" \
              "release-assets/module.json" \
              --title "Le Jeu des Six Couronnes ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
