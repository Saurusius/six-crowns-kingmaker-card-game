name: Publish Release

on:
  push:
    branches:
      - master
    paths:
      - module.json
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Foundry release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Read module metadata
        id: module
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).version")
          ID=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).id")
          test -n "$VERSION" && test -n "$ID" || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=six-crowns-kingmaker-card-game-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        shell: bash
        run: |
          EXPECTED_DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/v${{ steps.module.outputs.version }}/${{ steps.module.outputs.zip }}"
          EXPECTED_MANIFEST="https://github.com/${{ github.repository }}/releases/latest/download/module.json"
          ACTUAL_DOWNLOAD=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).download || ''")
          ACTUAL_MANIFEST=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).manifest || ''")

          test "$ACTUAL_DOWNLOAD" = "$EXPECTED_DOWNLOAD" || {
            echo "::error::URL download incorrect"
            echo "Attendu: $EXPECTED_DOWNLOAD"
            echo "Actuel: $ACTUAL_DOWNLOAD"
            exit 1
          }

          test "$ACTUAL_MANIFEST" = "$EXPECTED_MANIFEST" || {
            echo "::error::URL manifest incorrect"
            echo "Attendu: $EXPECTED_MANIFEST"
            echo "Actuel: $ACTUAL_MANIFEST"
            exit 1
          }

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.js' -print0)

      - name: Validate JSON data
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) return walk(full);
              return entry.isFile() && entry.name.endsWith(".json") ? [full] : [];
            });
          }

          const files = ["module.json", ...["data", "lang", "assets"]
            .filter((dir) => fs.existsSync(dir))
            .flatMap(walk)];

          for (const file of files) JSON.parse(fs.readFileSync(file, "utf8"));
          console.log(files.length + " fichiers JSON validés.");
          NODE

      - name: Detect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.module.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Foundry ZIP
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/package
          rsync -a ./ dist/package/ --exclude='.git' --exclude='.github' --exclude='dist' --exclude='install-local.ps1' --exclude='DEV_NOTES_*' --exclude='RELEASE_NOTES_*'
          cd dist/package
          zip -r -9 "../${{ steps.module.outputs.zip }}" .
          cd ../..
          test -f "dist/${{ steps.module.outputs.zip }}"
          unzip -l "dist/${{ steps.module.outputs.zip }}" | grep -q "module.json"

      - name: Upload release files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.module.outputs.zip }}
          path: |
            dist/${{ steps.module.outputs.zip }}
            module.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.module.outputs.tag }}" \
            "dist/${{ steps.module.outputs.zip }}" \
            "module.json" \
            --target master \
            --title "Le Jeu des Six Couronnes v${{ steps.module.outputs.version }}" \
            --generate-notes

      - name: Repair existing release assets
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ steps.module.outputs.tag }}" \
            "dist/${{ steps.module.outputs.zip }}" \
            "module.json" \
            --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ASSETS=$(gh release view "${{ steps.module.outputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          grep -Fxq "${{ steps.module.outputs.zip }}" <<< "$ASSETS" || { echo "::error::ZIP absent de la release"; exit 1; }
          grep -Fxq "module.json" <<< "$ASSETS" || { echo "::error::module.json absent de la release"; exit 1; }
