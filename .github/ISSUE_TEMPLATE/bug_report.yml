name: Rapport de bug
description: Signaler un comportement incorrect du module
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: foundry
    attributes:
      label: Version de Foundry
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Décrivez les actions effectuées et le résultat obtenu.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
